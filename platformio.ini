; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
; Voice control (ESP_SR) needs Arduino-ESP32 core 3.3.x, which the official
; PlatformIO espressif32 platform doesn't ship yet — using the pioarduino
; community fork instead (same espressif32 platform API, newer core). Pin to
; a specific release so builds stay reproducible.
; https://github.com/pioarduino/platform-espressif32/releases
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_echo = yes
; Custom partitions.csv (project root): drops the OTA dual-app-slot scheme
; (not used — we flash over USB) to make room for the ~4MB "model" partition
; ESP_SR needs for its offline speech-recognition models.
board_build.partitions = partitions.csv
extra_scripts = post:flash_sr_models.py
lib_deps =
    madhephaestus/ESP32Servo@^3.2.1
    bblanchon/ArduinoJson@^7.4.3
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.17
    fluxgarage/FluxGarage RoboEyes@^1.1.1
